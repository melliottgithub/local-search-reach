name: run on sample data

on:
  push:
    branches: [main]
  pull_request:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python src/sample_data.py
      - run: python src/reach.py
      - run: python src/top3_classifier.py
      - run: python src/synthetic_control.py
      - uses: actions/upload-artifact@v4
        with:
          name: charts-on-sample-data
          path: results/run/
